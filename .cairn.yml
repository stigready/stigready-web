# Cairn pipeline: validates every commit and same-repo PR to main.
version: 1
name: stigready-web
# This repository is public: no include or review agent here may name another repository (Cairn refuses one; decision
# 0116 part 2), so the review jobs below name a role.
public: true

triggers:
  manual: true
  poll:
    branches: [main]
    interval: 5m
  pull_requests:   # same-repository PRs into main; no secrets, never forks
    branches: [main]
    interval: 5m
  # Decision 0114 L3: the nightly drift watch. Cairn loads a new schedule PAUSED: it runs only when cairn-server.yml
  # schedules.allow lists stigready-web/copy-drift and an admin enables it. 06:30 UTC follows stigready's
  # marketplace-snapshot schedule (every 6 h, on the hour), so the snapshot it reads is at most 2 h old.
  schedule:
    - name: copy-drift
      cron: "30 6 * * *"
      timezone: UTC
      jobs: [copy-drift-watch]
      overlap: skip
      catch_up: true

jobs:
  - name: validate
    stage: verify
    status: validate   # the context branch protection requires (was the GitHub Actions job)
    timeout: 15m
    run:
      exec:
        steps:
          # The validator's own packages, hash-pinned (stigready-web#57: defusedxml). A pull request runs main's pipeline
          # with its own checkout, so this step lands before the validator imports anything from it.
          # Mirror first, as stigready's scripts/pip-install-locked.sh does (decision 0102): each verified wheelhouse
          # offline ($MIRROR_DIR when set, /opt/mirror baked into the Cairn runner images, /mnt/stigready/mirror), then
          # the package index only when none holds the whole set. --require-hashes and --only-binary :all: on every
          # attempt (wheels only: pip never builds the sdist the lock also hashes), and "${MIRROR_DIR:-}" quoted so a
          # value with spaces or glob characters stays one path (stigready-web#67; CINC controls web-deps-*). Inline
          # rather than a script in the checkout, so open pull requests that predate it still find it (main's pipeline).
          - name: deps
            run: |-
              python3 -m venv .ci-venv
              REQ=scripts/requirements-validate.txt
              src=
              for d in "${MIRROR_DIR:-}" /opt/mirror /mnt/stigready/mirror; do
                [ -d "$d/pypi" ] || continue
                if .ci-venv/bin/pip install --quiet --require-hashes --only-binary :all: --no-index \
                    --find-links "$d/pypi" -r "$REQ"; then
                  src="$d/pypi"; break
                fi
                echo "deps: $d/pypi does not hold all of $REQ; trying the next source" >&2
              done
              if [ -n "$src" ]; then
                echo "deps: $REQ installed offline from $src" >&2
              else
                echo "deps: $REQ from the package index (hash-checked)" >&2
                .ci-venv/bin/pip install --quiet --require-hashes --only-binary :all: -r "$REQ"
              fi
          - name: validate-site
            run: .ci-venv/bin/python scripts/validate-site.py
          # Decision 0114: the copy-truth controls render pages with Node and jsdom, pinned (scripts/render/setup.sh:
          # the runner image's /opt/node or a sha256-checked tarball, then npm ci from the lock). No renderer, no pass.
          - name: render-setup
            run: |-
              set -eu
              mkdir -p .render
              bash scripts/render/setup.sh scripts/render .render/node > .render/node-path
          # Decision 0003: the assertions about pinned assets, the CSP and site.css freshness are CINC controls
          # (claude-agents#152). The default runner image carries cinc-auditor.
          - name: cinc-stigready-web
            run: COPY_TRUTH_NODE="$(cat .render/node-path)" cinc-auditor exec cinc/profiles/stigready-web --no-color --chef-license accept-silent

  # Decision 0114 (claude-agents): public copy must match production. stigready-web#70 showed all 56 StigReady Applied
  # products as "Coming soon" while all 56 were Public on AWS Marketplace, and every review passed because each compared
  # the copy with catalog.json. The PR check takes the checker, the renderer (scripts/render: Node v24.21.0 and jsdom
  # 30.1.1, pinned) and the snapshot keys from origin/$CAIRN_BASE_REF, never from the PR, so a PR cannot change what judges
  # it. Pages are judged by what they RENDER: each page's own scripts and styles run against its catalog.json, and a
  # product counts as purchasable only if a visible link to its listing is rendered. CINC web-copy-truth-01, -02, -04
  # to -08.
  #
  # L1 copy-truth: the PR's site against the live Marketplace snapshot. PR runs get no AWS credentials (Cairn), so the
  # snapshot is the file stigready's marketplace-live-snapshot job (marketplace-ro) writes to this repo's
  # live/marketplace branch. Any repo writer can push that branch, so the snapshot counts only with its signature
  # (marketplace-live.json.sig) by a key in the base's config/snapshot-signers (0114 section 1). A missing, unsigned,
  # badly signed, empty or >26 h old snapshot exits 2 (production state unknown).
  # Trust root: before the check, the BASE's checker compares this PR's tree with the base's config/trust-root-paths
  # and config/trust-root.sha256 and names every changed entry (the checker, the renderer, these jobs, the CINC
  # controls). This status fails on any such change; it detects, it does not stop a merge while copy-truth is
  # advisory. Only copy-removal-gate (stigready-web#96) makes such a change need the owner's signature.
  # ADVISORY. Do not drop `advisory` or make copy-truth a required context, and do not add the first key to
  # config/snapshot-signers, before stigready-web#96 has merged: until then nothing stops one PR from weakening the
  # checker and the next from being judged by it. The PR that adds the snapshot key cites the fingerprint
  # (ssh-keygen -lf) of the Vault-held key it lists. Prices only warn until cairn-marketplace-ro can read Offers.
  - name: copy-truth
    stage: verify
    when: pull_request
    advisory: true
    status: copy-truth
    timeout: 15m
    run:
      exec:
        steps:
          - name: check
            run: |-
              set -eu
              t=$(mktemp -d)
              mkdir -p "$t/base" "$t/snap"
              git archive "origin/${CAIRN_BASE_REF:?}" | tar -x -C "$t/base"
              # The trust root, judged by the base's checker, list and manifest. Its result is kept, not swallowed:
              # the step exits with the worse of this and the copy check below.
              rc=0
              python3 -I "$t/base/scripts/check-copy-vs-marketplace.py" --mode trust-root --repo . --base "$t/base" \
                --out copy-truth/trust-root.md || rc=$?
              node=$(bash "$t/base/scripts/render/setup.sh" "$t/base/scripts/render" "$t/node")
              echo "renderer: $("$node" --version) at $node"
              git -C "$t/snap" init -q
              git -C "$t/snap" fetch -q --depth 1 https://github.com/stigready/stigready-web.git live/marketplace
              git -C "$t/snap" show FETCH_HEAD:marketplace-live.json > "$t/marketplace-live.json"
              # No signature on the branch: the checker reports it and exits 2 (never a pass).
              git -C "$t/snap" show FETCH_HEAD:marketplace-live.json.sig > "$t/marketplace-live.json.sig" \
                || rm -f "$t/marketplace-live.json.sig"
              python3 -I "$t/base/scripts/check-copy-vs-marketplace.py" --mode pr --site . --node "$node" \
                --renderer "$t/base/scripts/render/render.mjs" \
                --snapshot "$t/marketplace-live.json" --snapshot-signers "$t/base/config/snapshot-signers" \
                --out copy-truth/report.md || { r=$?; [ "$r" -gt "$rc" ] && rc=$r; }
              exit "$rc"

  # L3 copy-drift-watch: nightly (schedule copy-drift), read-only. Fetches stigready.com live (sitemap pages, the scripts
  # and stylesheets they load, /catalog.json), renders it, checks it against the live snapshot (at most 2 h old), and
  # checks the public role READMEs (release against the newest v* tag) and the pages in config/copy-truth-sources.yml.
  # On drift the run fails (ntfy, decision 0073) and the one issue titled "copy drift: public copy differs from
  # production" is opened or updated (a comment only when the findings change); a clean night closes it. GitHub: a
  # minted token with issues: write on this repo only (cairn-server.yml github_write.grants.stigready-web.copy-drift-watch;
  # until it is granted, a run is refused at start). No AWS credential: the snapshot carries production.
  - name: copy-drift-watch
    stage: watch
    when: manual
    timeout: 20m
    github_token:
      repositories: [stigready/stigready-web]
      permissions: {issues: write}
    artifacts: {paths: [copy-drift]}
    run:
      exec:
        steps:
          - name: drift
            run: |-
              set -eu
              t=$(mktemp -d)
              node=$(bash scripts/render/setup.sh scripts/render "$t/node")
              echo "renderer: $("$node" --version) at $node"
              git -C "$t" init -q
              git -C "$t" fetch -q --depth 1 https://github.com/stigready/stigready-web.git live/marketplace
              git -C "$t" show FETCH_HEAD:marketplace-live.json > "$t/marketplace-live.json"
              git -C "$t" show FETCH_HEAD:marketplace-live.json.sig > "$t/marketplace-live.json.sig" \
                || rm -f "$t/marketplace-live.json.sig"
              python3 -I scripts/check-copy-vs-marketplace.py --mode drift --node "$node" \
                --snapshot "$t/marketplace-live.json" --snapshot-signers config/snapshot-signers \
                --max-age-hours 2 --sources config/copy-truth-sources.yml \
                --out copy-drift/report.md --issue

  # Scanners (decision 0076 part B; owner 2026-10-21: "we should be running trivy and any other tools that make sence").
  # Fitted to this repo: static HTML/JSON and one Python validator.
  # Cairn's `cairn-scan` (in its `scan` image) runs each tool offline against the image's baked
  # Trivy DBs and Semgrep packs (until Cairn v0.4.2 no step saw the image's offline settings, so every pull request
  # run's trivy tried to download its DB and failed), keeps a JSON result per tool (artifact scan-results/) and a
  # summary of counts, and writes `<tool>=<findings>`.
  # ADVISORY: never in the aggregate. Its own `scan` context (status_counts) reads "clean: trivy=0 ...", "findings:
  # ..." (failure) or "incomplete: trivy=? ..." (error: a scanner did not run). A scanner that cannot run fails its step
  # (exit 2, no allow_failure), so "did not run" is never a pass. Findings fail the context, not the job. Commands live
  # here (main's pipeline, which a PR cannot change); tool config never comes from the checkout, but its ignore files
  # do (.trivyignore, .gitleaksignore, nosemgrep): the summary names them, and before a scanner becomes required they
  # must come from the base branch.
  - name: scan
    stage: verify
    advisory: true
    status: scan
    status_counts: [trivy, gitleaks, semgrep, yamllint]
    artifacts: {paths: [scan-results]}
    timeout: 20m
    run:
      exec:
        image: scan
        steps:
          - name: versions
            run: cairn-scan versions
          - name: trivy
            run: cairn-scan trivy --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed .
          - name: gitleaks
            run: cairn-scan gitleaks
          - name: semgrep
            run: cairn-scan semgrep --severity ERROR .
          - name: yamllint
            run: cairn-scan yamllint
          - name: verdict
            run: cairn-scan verdict trivy gitleaks semgrep yamllint

  # Decision 0105, as amended by 0116: the three decision-0100 reviews, one Cairn review job each, on every pull request
  # head. Cairn's code, not a model, decides each status, under Cairn's app, so a head the merge train makes with
  # update-branch gets its verdicts back without anyone posting them.
  # The jobs name a role (agent_role), never a repository: this repository is public (public: true above), and Cairn's
  # server config maps each role to its pinned agent and model (decision 0116 part 2).
  # CARRY-OVER ONLY (0105 section 2) until the review key is in place: the model is never called. Success only when
  # git merge-tree --write-tree <reviewed head> <current main> is clean and its tree equals the new head's tree (0116
  # part 1), the newest review/<role> by a base_identities login on the reviewed head was success, and every require
  # context was success there in Cairn's own runs. Anything else is pending "full review needed: <reason>", never
  # success; the reviews are then done in full by hand (0100 interim).
  # base_identities is [] (decision 0159 took sclark007 off review_identities): no interim verdict is a base, so Cairn
  # carries over only its own full approve from its run store; a head without one waits for a fresh review (Apps are
  # never a base).
  # - No review.paths and no skip_branches: a skipped review reports success, and a filter pinned here could lag the
  #   merge train's public-facing list, so no filter may skip a PR the train treats as public-facing. A PR that
  #   touches no public-facing path sees these pending; the train does not gate on them.
  # - advisory: a needs-review job fails, and must not turn the aggregate red. timeout bounds how long it can hold it.
  # CINC review-jobs-0105-* keeps all of this.
  - name: review-security
    stage: review
    advisory: true
    status: review/security
    timeout: 10m
    review:
      agent_role: security
      require: [validate]
      base_identities: []
  - name: review-marketing
    stage: review
    advisory: true
    status: review/marketing
    timeout: 10m
    review:
      agent_role: marketing
      require: [validate]
      base_identities: []
  - name: review-qa
    stage: review
    advisory: true
    status: review/qa
    timeout: 10m
    review:
      agent_role: qa
      require: [validate]
      base_identities: []
